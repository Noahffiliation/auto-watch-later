[project]
name = "auto-watch-later"
version = "0.1.0"
description = "Automatically adds newly released videos from YouTube subscriptions to Watch Later playlist"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "google-api-python-client>=2.150.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B904",   # Within an except clause, raise from err
    "RUF001", # Ambiguous characters
    "BLE001", # Do not catch blind exception
    "S112",   # try-except-continue detected
    "SIM115", # Use context manager for opening files
]

[tool.ruff.lint.isort]
known-first-party = ["auto_watch_later"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
