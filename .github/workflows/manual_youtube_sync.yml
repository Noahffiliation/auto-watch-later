name: YouTube Auto-Adder (Manual)

on:
  workflow_dispatch:

concurrency:
  group: youtube-sync
  cancel-in-progress: false

permissions:
  contents: write

env:
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

jobs:
  execute:
    name: Sync YouTube Watch Later
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.3'

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --no-build --locked --no-dev

      - name: Restore Secure Authentication Token
        env:
          YOUTUBE_TOKEN_PICKLE_B64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 }}
        run: |
          echo "$YOUTUBE_TOKEN_PICKLE_B64" | base64 --decode > token.pickle

      - name: Run YouTube Script
        run: uv run --no-build --locked auto_watch_later.py

      - name: Save Memory State (last_check_time.txt)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_check_time.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update last check time [skip ci]" && git push)

      - name: Generate Job Summary
        if: always()
        run: |
          echo "## ▶️ YouTube Watch Later Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Sync Outcome** | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Log Artifact** | \`youtube-sync-logs\` |" >> $GITHUB_STEP_SUMMARY
          if [ -f "last_check_time.txt" ]; then
            echo "| **Last Check Time** | \`$(cat last_check_time.txt)\` |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: youtube-sync-logs
          path: logs/*.txt
          retention-days: 14
          if-no-files-found: ignore
