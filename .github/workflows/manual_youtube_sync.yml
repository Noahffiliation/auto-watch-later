name: YouTube Auto-Adder (Manual)

on:
  workflow_dispatch:

concurrency:
  group: youtube-sync
  cancel-in-progress: false

permissions:
  contents: write

env:
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

jobs:
  execute:
    name: Sync YouTube Watch Later
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.3'
          cache: 'pip'

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install --only-binary :all: --require-hashes -r requirements.txt; fi

      - name: Restore Secure Authentication Token
        env:
          YOUTUBE_TOKEN_PICKLE_B64: ${{ secrets.YOUTUBE_TOKEN_PICKLE_B64 }}
        run: |
          echo "$YOUTUBE_TOKEN_PICKLE_B64" | base64 --decode > token.pickle

      - name: Run YouTube Script
        run: python auto_watch_later.py

      - name: Save Memory State (last_check_time.txt)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_check_time.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update last check time [skip ci]" && git push)

      - name: Upload Logs
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: youtube-sync-logs
          path: logs/*.txt
          retention-days: 30
          if-no-files-found: ignore
