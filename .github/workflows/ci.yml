name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

jobs:
  python-ci:
    permissions:
      actions: read
      contents: read
      packages: write
      security-events: write
    uses: Noahffiliation/.github/.github/workflows/reusable-python-ci.yml@f31208e53b1aa658501f275f487b04931e7e4c93 # v1.3.20
    with:
      python-version: "3.12.3"
      test-docker: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
