name: "CodeQL Advanced"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  security-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: Noahffiliation/.github/.github/workflows/reusable-codeql.yml@62e48ea24d6b7b8fe4cf7cc6f139ac168f213e99 # v1.3.21
    with:
      language: "python"
