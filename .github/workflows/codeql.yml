name: "CodeQL Advanced"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    permissions:
      contents: read
      security-events: write
    uses: Noahffiliation/.github/.github/workflows/reusable-codeql.yml@b156c12177fb356641cfd43e37e7e669d1860374 # v1.0.0
    with:
      language: "python"
