name: "CodeQL Advanced"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    permissions:
      contents: read
      security-events: write
    uses: Noahffiliation/.github/.github/workflows/reusable-codeql.yml@e6429a745c9f31b6ddc5943f1362905de403385e # v1.3.7
    with:
      language: "python"
