name: "CodeQL Advanced"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    permissions:
      contents: read
      security-events: write
    uses: Noahffiliation/.github/.github/workflows/reusable-codeql.yml@620e72112a8fa364357ba3cf853ae5458f32b600 # v1.3.16
    with:
      language: "python"
